version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - sway-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sway-server
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sway
      DB_USER: postgres
      DB_PASSWORD: password123
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: sway_production_secret_key
    ports:
      - '5000:5000'
    volumes:
      - ./uploads:/app/uploads
    networks:
      - sway-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sway-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:5173'
    networks:
      - sway-network

volumes:
  postgres_data:

networks:
  sway-network:
    driver: bridge
