<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWAY - Private Verified Connections</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
 
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand logo" href="#"> <img src="img/logo.png" alt="logo"></a>
    
    <div class="collapse navbar-collapse" id="menu">
  
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="btn btn-outline-light" href="register.html">Register</a>
        <a class="btn btn-wine" href="login.html">Login</a>
      </div>
    </div>
  </div>
</nav>
<section class="login_page">
 
 <div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-10">

      <div class="card register-card"> 
            <div class="p-4 p-md-5">
              <h3 class="fw-bold mb-1">Register Now</h3>
              <p class="text-muted mb-4">Please fill your details below.</p>

              <form>

                <div class="gender-select mb-5">
  <label class="gender-card active">
    <input type="radio" name="gender" value="girl" checked>
    <span class="title girl">Female</span>
    <img src="img/girl.png" alt="Girl">
  </label>

  <label class="gender-card">
    <input type="radio" name="gender" value="boy">
    <span class="title boy">Male</span>
    <img src="img/boy.png" alt="Boy">
  </label>
</div>

                <div class="row g-3">

                  <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="Enter Username">
                  </div>
 

                  <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter email">
                  </div>                  

                  <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Create password">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm password">
                  </div>
                  
                  <div class="col-md-6">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-control" placeholder="Create Country">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" placeholder="City">
                  </div> 
                   <div class="col-md-12">
                    <label class="form-label">Date of birth</label>
                    <input type="date" class="form-control"  >
                  </div> 

                  <div class="col-md-6">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="terms">
                      <label class="form-check-label" for="terms">
                       I have read and accept the terms & conditions
                      </label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="terms">
                      <label class="form-check-label" for="terms">
                       I have read and accept the privacy policy
                      </label>
                    </div>
                  </div>
               

                  <div class="col-12">
                    <button type="submit" class="btn btn-wine btn-main w-100">
                      Create Account
                    </button>
                  </div>

                  <div class="col-12 text-center">
                    <p class="mb-0 text-muted">
                      Already have an account?
                      <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
                    </p>
                  </div>

                </div>
              </form>

            </div>
          </div> 

    </div>
  </div>
</div>
</section>
 

<footer id="contact">
  <div class="container">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="logo mb-3"> <img src="img/logo.png" alt="logo"></div>
        <p>Verified people. Private conversations. Real discretion.</p>
      </div>
      <div class="col-md-2"><h6>Quick Links</h6><p>Home<br>Verification<br>Membership</p></div>
      <div class="col-md-3"><h6>Support</h6><p>Terms & Conditions<br>Privacy Policy<br>Help Center</p></div>
      <div class="col-md-3">
        <h6>Social Media</h6>
        <div class="social_media">
           <a href="#"><i class="bi bi-facebook"></i></a>
           <a href="#"><i class="bi bi-instagram"></i></a>
           <a href="#"><i class="bi bi-twitter-x"></i></a> 
        </div>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
